[package]
name = "fdmv-recorder"
description = "Screen recorder that stores each application's audio as a separate FDMV chain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fdmv-recorder"
path = "src/main.rs"

[dependencies]
libfdmv.workspace = true
fdmv-gui.workspace = true
fdmv-capture.workspace = true
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
eframe = "0.36"
rfd = "0.17"
