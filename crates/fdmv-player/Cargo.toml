[package]
name = "fdmv-player"
description = "Desktop player for the FDMV video format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fdmv-player"
path = "src/main.rs"

[dependencies]
libfdmv.workspace = true
anyhow = "1"
cpal = "0.18"
eframe = "0.36"
fontdb = "0.24"
rfd = "0.17"

[dev-dependencies]
tempfile = "3"
