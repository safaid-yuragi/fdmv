name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev libopus-dev libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install dav1d opus pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: fdmv-macos-arm64
          path: |
            target/release/fdmv
            target/release/fdmv-player
            target/release/fdmv-editor
            target/release/fdmv-recorder

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-dav1d
            mingw-w64-ucrt-x86_64-opus
      # ffmpeg を入れていないので、ffmpeg を使うテストはスキップされる。
      - run: cargo test --workspace
      - run: cargo build --release
